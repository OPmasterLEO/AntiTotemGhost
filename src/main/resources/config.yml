# AntiTotemGhost configuration

# Ticks to wait before final lethal reconciliation decision.
# Recommended: 1 for competitive PvP, 2 for high-latency environments.
reconciliation-ticks: 1

# Lookback window for swap/totem activity.
swap-buffer-ticks: 2

# If enabled, lethal hits with immediate hand totem are handled instantly.
enable-fast-path: true

# Enables verbose diagnostics.
debug-mode: false

# Sandbox mode favors resilience for stress testing.
sandbox-mode: false